<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ประวัติการลา | PVT HR Leave</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="/css/leave-history.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header class="user-header">
    <div class="brand-row">
      <img src="/assets/icons/logo-pvt.png" alt="PVT" id="user-avatar" />
      <div>
        <div class="hello">PVT HR Leave</div>
        <h1 id="emp-name">ประวัติการลา</h1>
        <span id="emp-detail">กำลังโหลดข้อมูลพนักงาน...</span>
      </div>
    </div>
    <div class="history-actions">
      <button class="btn-back-home" onclick="history.back()">
        <span class="material-symbols-outlined">home</span> กลับหน้าหลัก
      </button>
      <button class="btn-back-home primary-action" onclick="exportMyLeaveHistoryExcel()">
        <span class="material-symbols-outlined">download</span> Export Excel
      </button>
    </div>
  </header>

  <main class="panel">
    <div class="panel-header">
      <span class="material-symbols-outlined text-primary">history</span>
      <h2>รายการใบลาของฉัน</h2>
    </div>

    <div class="history-summary">
      <article><span>ทั้งหมด</span><strong id="sumAll">0</strong></article>
      <article><span>รออนุมัติ</span><strong id="sumPending">0</strong></article>
      <article><span>อนุมัติแล้ว</span><strong id="sumApproved">0</strong></article>
      <article><span>วันลารวม</span><strong id="sumDays">0</strong></article>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ประเภทการลา</th>
            <th>ช่วงวันที่</th>
            <th>จำนวน</th>
            <th>เหตุผล</th>
            <th>สถานะ</th>
          </tr>
        </thead>
        <tbody id="table-data-rows">
          <tr><td colspan="5" class="empty-state">กำลังโหลดประวัติการลา...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/supabase-config.js"></script>
  <!-- แทนที่หรือเพิ่มต่อจาก Supabase CDN ใน <head> -->
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/leave-history.js"></script>
</body>
</html>
