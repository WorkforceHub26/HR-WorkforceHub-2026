<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>หน้าพนักงาน | PVT HR Leave</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="/css/index-user.css?v=999" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  

  
</head>

<body>
  <main class="app">
    
        <button class="logout-btn" onclick="history.back()">⬅️ ย้อนกลับ</button>
      
    <header class="user-header">
      <div class="brand-row">
        <img id="userAvatar" src="/assets/img/default-avatar.jpg" alt="PVT" />
        <div>
          <p class="hello">สวัสดีค่ะ</p>
          <h1 id="userName">กำลังโหลด...</h1>
          <span id="userDepartment">PVT HR Leave</span>
        </div>
      </div>
          <!-- ปุ่มสลับหน้าสำหรับหัวหน้าแผนก (เริ่มต้นจะถูกซ่อนไว้) -->
          <!-- ปุ่มสลับไปโหมดอนุมัติสำหรับหัวหน้างาน (เริ่มต้นซ่อนไว้) -->
          <a href="/pages/user/approved-leaves.html" id="approverModeBtn" style="display: none; align-items: center; gap: 12px; background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 14px 18px; border-radius: 12px; text-decoration: none; font-weight: 600; margin: 15px 10px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25); transition: all 0.3s ease;">
            <span class="material-symbols-outlined" style="font-size: 22px;">supervisor_account</span>
            <div style="text-align: left; line-height: 1.2;">
              <span style="display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.5px;">ระบบหัวหน้างาน</span>
              <span style="display: block; font-size: 10px; color: #bfdbfe; font-weight: 400;">สลับไปหน้าอนุมัติใบลา ➜</span>
            </div>
          </a>


      
      <button type="button" class="logout-btn" onclick="logout(); return false;">
        ออก
      </button>
    </header>


    


    
      
        <div class="leave-section">
    <!-- หัวข้อใหญ่คมชัดตามที่พี่ต้องการ -->
    <h2>📊 สิทธิ์วันลาคงเหลือ</h2>
    
    <div id="leaveBalancesContainer" class="leave-grid">
        <span style="color: var(--muted); font-size: 14px; font-style: italic;">⏳ กำลังโหลดข้อมูลสิทธิ์วันลา...</span>
    </div>
       </div>
      
    

    <section class="menu-section">
      <h2>เมนูจัดการสำหรับพนักงาน</h2>
      <div class="menu-grid">
        <button class="menu-card" onclick="goToLeaveForm()">
          <div class="menu-icon blue">📝</div>
          <div>
            <strong>ขออนุญาตลา</strong>
            <p>ยื่นใบลาออนไลน์อนุมัติไว</p>
          </div>
        </button>

        <button class="menu-card" onclick="goToRules()">
          <div class="menu-icon purple">📖</div>
          <div>
            <strong>หลักเกณฑ์การลา</strong>
            <p>เปิดอ่านเงื่อนไขบริษัท</p>
          </div>
        </button>

        <button class="menu-card" onclick="goToLeaveHistory()">
          <div class="menu-icon green">⏳</div>
          <div>
            <strong>ประวัติการลา</strong>
            <p>ตรวจสอบสถานะใบลา</p>
          </div>
        </button>

        <button class="menu-card" onclick="goToProfile()">
          <div class="menu-icon orange">👤</div>
          <div>
            <strong>ข้อมูลพนักงาน</strong>
            <p>ตรวจสอบรหัส ชื่อ และวันเริ่มงาน</p>
          </div>
        </button>
                  <!-- ปุ่มกดดูบัตรประจำตัวพนักงานดิจิทัล -->
          <button class="menu-card btn-premium-card" onclick="viewMyDigitalCard()" style="display: flex; align-items: center; justify-content: center; gap: 8px; flex-direction: row; padding: 16px;">
          <span style="font-size: 22px;">🪪</span> 
          <strong style="color: white; margin: 0;">ดูบัตรพนักงาน</strong>
        </button>
      </div>
    </section>

    <section class="recent-card">
      <div class="section-head">
        <h2>รายการล่าสุด</h2>
        <button onclick="goToLeaveHistory()">ดูทั้งหมด</button>
      </div>
      <div id="recentList" class="recent-list">
        <div class="empty-state">กำลังโหลดรายการลา...</div>
      </div>
    </section>

    <button class="contact-fab" onclick="goToContactHR()">ติดต่อ HR</button>
  </main>

  <script src="/js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/js/auth-guard.js"></script>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
     if (typeof logUserAction === "function") {
       logUserAction("คุณ สมชาย ใจดี", "OPEN_PAGE", "เปิดเข้ามาที่หน้าแบบฟอร์มยื่นใบลา");
     }
  });
  </script>
  <script src="/js/index-user.js"></script>
</body>
</html>
