<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบอนุมัติใบลาสำหรับหัวหน้า | PVT HR Hub</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/approved-leaves.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 🚀 ฝัง CSS มือถือตรงนี้เพื่อแก้ปัญหา Cache ดื้อ และบังคับทำงาน 100% -->
  <!-- 🚀 ฝัง CSS มือถือตรงนี้เพื่อทำ Card View (ไม่ต้องเลื่อนซ้ายขวา) -->
</head>

<body>
  <div class="app-shell">
    <div class="main-content">
     
      <!-- ส่วน Header และปุ่มย้อนกลับ -->
      <div class="page-header">
       <button class="btn-header-back" onclick="history.back()">⬅️ ย้อนกลับ</button>

        <div>
          <h2>พิจารณาคำขออนุมัติลา</h2>
          <p>รายการคำขอลาของพนักงานที่รอการตรวจสอบและอนุมัติจากหัวหน้างานและผู้จัดการฝ่าย</p>
        </div>
      </div>

      <div id="roleTabsContainer"></div>

      <!-- พื้นที่ตารางอนุมัติใบลา -->
      <div class="approval-panel">
        <div class="table-responsive">
          <table class="approval-table">
            <thead>
              <tr>
                <th>ข้อมูลผู้ลา</th>
                <th>ประเภทการลา</th>
                <th>วันเวลาที่ลา</th>
                <th class="text-center">จำนวนวัน</th>
                <th>เหตุผลการลา</th>
                <th class="text-center">สถานะใบลา</th>
                <th class="text-center">จัดการ</th>
              </tr>
            </thead>
            <tbody id="leaveTableBody">
              <tr>
                <td colspan="7" class="text-center" style="padding: 40px; color: #64748b;">
                  ⏳ กำลังโหลดข้อมูลคำขออนุมัติลา...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      
    </div>
  </div>

  <!-- Modal สำหรับยืนยันพิจารณาใบลา -->
  <div id="actionModal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modalTitle">พิจารณาใบลา</h3>
      <p id="modalEmployeeName">พนักงาน: </p>
      
      <input type="hidden" id="targetLeaveId">
      <input type="hidden" id="targetStatus">
      
      <div class="form-group">
        <label for="approvalComment">ความคิดเห็น / เหตุผลประกอบการพิจารณา:</label>
        <textarea id="approvalComment" rows="3" placeholder="ระบุเหตุผลอนุมัติตามขั้นตอน หรือสาเหตุที่ไม่นุมัติใบลา..."></textarea>
      </div>
      
      <div class="modal-actions">
        <button id="btnCancelAction" class="btn-cancel">ยกเลิก</button>
        <button id="btnSubmitAction" class="btn-submit">ยืนยันบันทึก</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/supabase-config.js"></script>
  <script src="/js/approved-leaves.js"></script>
  <script src="/js/auth-guard.js"></script>
</body>
</html>
