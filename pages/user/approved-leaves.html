<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบอนุมัติใบลาสำหรับหัวหน้า | PVT HR Hub</title>
  
  <!-- Google Fonts & Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
 
  <!-- Supabase Client & SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- 🎨 เรียกใช้ไฟล์ CSS ที่อัปเดตแล้ว -->
  <link rel="stylesheet" href="/css/approved-leaves.css">
</head>
<body>

  <div class="app-shell">
    <main class="main-content">
     
      <!-- 👑 Header & ปุ่มย้อนกลับ -->
      <header class="page-header">
        <button class="btn-header-back" onclick="history.back()">
          <span class="material-symbols-outlined">arrow_back</span> ย้อนกลับ
        </button>

        <div class="header-title">
          <h2>พิจารณาคำขออนุมัติลา</h2>
          <p id="tableTitle">รายการคำขอลาของพนักงานที่รอการตรวจสอบและอนุมัติจากหัวหน้างานและผู้จัดการฝ่าย</p>
        </div>
      </header>

      <!-- 📊 การ์ดสถิติสรุปจำนวนใบลา -->
      <section class="stats-grid">
        <div class="stat-card pending">
          <div class="stat-label">รอพิจารณา</div>
          <div class="stat-value" id="countPending">0 <small>รายการ</small></div>
        </div>
        <div class="stat-card approved">
          <div class="stat-label">อนุมัติแล้ว</div>
          <div class="stat-value" id="countApproved">0 <small>รายการ</small></div>
        </div>
        <div class="stat-card rejected">
          <div class="stat-label">ปฏิเสธแล้ว</div>
          <div class="stat-value" id="countRejected">0 <small>รายการ</small></div>
        </div>
      </section>

      <!-- 🏛️ ตาราง / Card View อนุมัติใบลา -->
      <section class="approval-panel">
        <div class="table-responsive">
          <table class="approval-table">
            <thead>
              <tr>
                <th>ข้อมูลผู้ลา</th>
                <th>ประเภทการลา</th>
                <th>วันเวลาที่ลา</th>
                <th class="text-center">จำนวนวัน</th>
                <th>เหตุผลการลา</th>
                <th class="text-center">สถานะใบลา</th>
                <th class="text-center">จัดการ</th>
              </tr>
            </thead>
            <tbody id="leaveTableBody">
              <tr>
                <td colspan="7" class="text-center empty-state">
                  ⏳ กำลังโหลดข้อมูลคำขออนุมัติลา...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
      
    </main>
  </div>

  <!-- 🪟 Modal สำหรับยืนยันพิจารณาใบลา -->
  <div id="actionModal" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modalTitle">พิจารณาใบลา</h3>
      <p id="modalEmployeeName" class="modal-subtitle">พนักงาน: -</p>
      
      <div class="form-group">
        <label for="approvalComment">ความคิดเห็น / เหตุผลประกอบการพิจารณา:</label>
        <textarea id="approvalComment" rows="3" placeholder="ระบุเหตุผลอนุมัติตามขั้นตอน หรือสาเหตุที่ไม่อนุมัติใบลา..."></textarea>
      </div>
      
      <div class="modal-actions">
        <!-- JS จะสร้างปุ่ม Dynamic มาวางที่นี่ -->
      </div>
    </div>
  </div>

  <!-- ⚡ สคริปต์การทำงาน -->
   <script src="/js/supabase-config.js"></script>
  <script src="/js/approved-leaves.js"></script>
    
  
</body>
</html>
