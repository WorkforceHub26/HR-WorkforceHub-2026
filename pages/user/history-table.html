<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ประวัติพนักงานและประวัติการลา | PVT HR Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #0f766e;
      --primary-2: #0891b2;
      --primary-soft: #ecfeff;
      --bg: #f6faf9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #dbe7e5;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Kanit", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, #ccfbf1 0, transparent 32%),
        radial-gradient(circle at 90% 10%, #bae6fd 0, transparent 30%),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      min-height: 100vh;
    }
    .page { width: min(1440px, 100%); margin: 0 auto; padding: 24px; }
    .topbar, .panel {
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 20px; margin-bottom: 18px; }
    .title-row { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .title-row img { width: 54px; height: 54px; object-fit: contain; border-radius: 14px; background: #fff; padding: 6px; border: 1px solid var(--border); }
    .eyebrow { margin: 0; color: var(--primary); font-size: 13px; font-weight: 700; }
    h1 { margin: 2px 0 0; font-size: clamp(22px, 3vw, 30px); line-height: 1.2; }
    .top-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
    button, .btn-link {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .btn-light { background: #fff; color: #334155; border: 1px solid var(--border); }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff; }
    .grid { display: grid; gap: 16px; }
    .summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 16px; }
    .stat-card { padding: 18px; }
    .stat-card span { color: var(--muted); font-size: 13px; }
    .stat-card strong { display: block; margin-top: 6px; font-size: 32px; color: var(--primary); }
    .chart-grid { grid-template-columns: 1.2fr .8fr; margin-bottom: 16px; }
    .panel { padding: 18px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .panel-head h2 { margin: 0; font-size: 19px; }
    .bars { display: grid; gap: 10px; }
    .bar-row { display: grid; grid-template-columns: 160px 1fr 56px; gap: 10px; align-items: center; font-size: 13px; }
    .bar-track { height: 12px; border-radius: 999px; background: #e2e8f0; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--primary-2)); }
    .filter-panel { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
    .search-input, .select-input {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      font-family: inherit;
      background: #fff;
      outline: none;
    }
    .search-input { flex: 1 1 320px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: #fff; }
    table { width: 100%; border-collapse: collapse; min-width: 980px; }
    th, td { padding: 13px 14px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; font-size: 14px; }
    th { background: #f8fafc; color: #475569; font-weight: 700; }
    tbody tr:hover { background: #f0fdfa; }
    .avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
    .status { display: inline-flex; padding: 4px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .status.active, .status.approved { background: #dcfce7; color: #166534; }
    .status.pending { background: #fef3c7; color: #92400e; }
    .status.rejected, .status.cancelled, .status.inactive { background: #fee2e2; color: #991b1b; }
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(15, 23, 42, .48);
      z-index: 50;
    }
    .modal.open { display: grid; }
    .modal-card {
      width: min(1100px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(15,23,42,.32);
      padding: 20px;
    }
    .detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 12px 0 16px; }
    .detail-item { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
    .detail-item span { display: block; color: var(--muted); font-size: 12px; }
    .detail-item strong { display: block; margin-top: 3px; }
    .empty { padding: 24px; text-align: center; color: var(--muted); }
    @media (max-width: 900px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .top-actions { width: 100%; justify-content: stretch; }
      .top-actions button, .top-actions .btn-link { flex: 1; justify-content: center; }
      .summary-grid, .chart-grid, .detail-grid { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 1fr; gap: 5px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="title-row">
        <img src="/assets/icons/logo-pvt.png" alt="PVT" />
        <div>
          <p class="eyebrow">PVT HR HUB</p>
          <h1>ประวัติพนักงานและสรุปการลา</h1>
        </div>
      </div>
      <div class="top-actions">
        <a class="btn-link btn-light" href="/hr.html"><span class="material-symbols-outlined">arrow_back</span>กลับ HR</a>
        <button class="btn-light" onclick="refreshDashboard()"><span class="material-symbols-outlined">refresh</span>รีเฟรช</button>
        <button class="btn-primary" onclick="exportAllLeaveHistoryExcel()"><span class="material-symbols-outlined">download</span>Excel ประวัติลา</button>
      </div>
    </header>

    <section class="grid summary-grid">
      <article class="panel stat-card"><span>พนักงานทั้งหมด</span><strong id="statEmployees">0</strong></article>
      <article class="panel stat-card"><span>รายการลาทั้งหมด</span><strong id="statLeaves">0</strong></article>
      <article class="panel stat-card"><span>รออนุมัติ</span><strong id="statPending">0</strong></article>
      <article class="panel stat-card"><span>วันลารวม</span><strong id="statDays">0</strong></article>
    </section>

    <section class="grid chart-grid">
      <article class="panel">
        <div class="panel-head"><h2>กราฟสรุปตามประเภทการลา</h2><span id="typeChartNote" class="status active">พร้อมใช้งาน</span></div>
        <div id="typeChart" class="bars"></div>
      </article>
      <article class="panel">
        <div class="panel-head"><h2>สถานะคำขอ</h2></div>
        <div id="statusChart" class="bars"></div>
      </article>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>ทำเนียบพนักงาน</h2>
        <span id="loadStatus" class="status pending">กำลังโหลด</span>
      </div>
      <div class="filter-panel">
        <input id="empSearchInput" class="search-input" type="search" placeholder="ค้นหาชื่อ รหัส แผนก หรือตำแหน่ง..." oninput="renderEmployeeTable()" />
        <select id="deptFilter" class="select-input" onchange="renderEmployeeTable()">
          <option value="">ทุกแผนก</option>
        </select>
      </div>
      
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>รูป</th>
              <th>รหัส</th>
              <th>ชื่อ-นามสกุล</th>
              <th>ตำแหน่ง</th>
              <th>แผนก</th>
              <th>วันเริ่มงาน</th>
              <th>สถานะ</th>
              <th>รายละเอียด</th>
            </tr>
          </thead>
          <tbody id="employeeTableBody">
            <tr><td colspan="8" class="empty">กำลังโหลดข้อมูล...</td></tr>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             
          </tbody>
        </table>
      </div>
    </section>
    
  </main>

 <div id="employeeModal" class="modal" onclick="closeEmployeeModal(event)">
    <section class="modal-card" onclick="event.stopPropagation()">
      <div class="panel-head">
        <h2 id="modalTitle">รายละเอียดพนักงาน</h2>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button id="modalDownloadBtn" class="btn-primary" style="padding: 6px 12px; font-size: 13px;">
            <span class="material-symbols-outlined">download</span>ดาวน์โหลด Excel รายบุคคล
          </button>
          <button class="btn-light" onclick="closeEmployeeModal()"><span class="material-symbols-outlined">close</span>ปิด</button>
        </div>
      </div>
      <div id="modalBody"></div>
    </section>
  </div>

  <script src="/js/supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <!-- นำเข้า SweetAlert2 สำหรับทำป็อปอัปสวยๆ -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/js/history-table.js?v=2.0"></script>
  <script src="/js/auth-guard.js"></script>
</body>
</html>
