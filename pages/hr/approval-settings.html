<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ตั้งค่าสายอนุมัติใบลา | PVT Workforce Hub</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/global.css" />

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Sarabun", sans-serif;
        background: #f5f7fb;
        color: #1e293b;
      }
      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 28px 20px 50px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }
      .top h1 {
        margin: 0;
        font-size: 26px;
      }
      .top p {
        margin: 5px 0 0;
        color: #64748b;
      }
      .back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        color: #475569;
        font-weight: 700;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 8px 30px rgba(15, 23, 42, 0.05);
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .field.full {
        grid-column: 1/-1;
      }
      label {
        display: block;
        font-weight: 700;
        margin-bottom: 7px;
      }
      select {
        width: 100%;
        padding: 12px 13px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #fff;
        font: inherit;
      }
      .hint {
        color: #64748b;
        font-size: 13px;
        margin-top: 6px;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 20px;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 11px 18px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
      .save {
        background: #0f766e;
        color: #fff;
      }
      .save:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .btn-edit,
      .btn-delete {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 7px 10px;
        border-radius: 8px;
        font-size: 13px;
      }
      .btn-edit {
        background: #e0f2fe;
        color: #0369a1;
      }
      .btn-delete {
        background: #fee2e2;
        color: #b91c1c;
        margin-left: 6px;
      }
      .btn-edit:hover {
        background: #bae6fd;
      }
      .btn-delete:hover {
        background: #fecaca;
      }
      .action-cell {
        white-space: nowrap;
      }
      .section-title {
        margin: 28px 0 12px;
        font-size: 18px;
      }
      .table-wrap {
        overflow: auto;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
        background: #fff;
      }
      th,
      td {
        padding: 13px 14px;
        border-bottom: 1px solid #eef2f7;
        text-align: left;
      }
      th {
        background: #f8fafc;
        font-size: 13px;
        color: #475569;
      }
      .line-ok {
        color: #15803d;
        font-weight: 700;
      }
      .line-no {
        color: #b45309;
        font-weight: 700;
      }


      .btn-line-link {
  margin-top: 9px;
  padding: 8px 12px;
  background: #ecfdf5;
  color: #047857;
  border: 1px solid #a7f3d0;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.btn-line-link:hover {
  background: #d1fae5;
}





      .empty {
        text-align: center;
        color: #94a3b8;
        padding: 28px;
      }
      @media (max-width: 700px) {
        .form-grid {
          grid-template-columns: 1fr;
        }
        .field.full {
          grid-column: auto;
        }
        .top {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="top">
        <div>
          <a class="back" href="/pages/hr/home.html"
            ><span class="material-symbols-outlined">arrow_back</span>
            กลับหน้าหลัก HR</a
          >
          <h1>ตั้งค่าสายอนุมัติใบลา</h1>
          <p>กำหนดหัวหน้า L1 และผู้จัดการ L2 (ถ้ามี) ประจำแต่ละแผนก</p>
        </div>
      </div>

      <section class="card" style="margin-bottom: 20px">
        <div class="form-grid">
          <div class="field full">
            <label for="executiveSelect">ผู้บริหารอนุมัติหลัก L3</label>
            <select id="executiveSelect">
              <option value="">กำลังโหลดรายชื่อ...</option>
            </select>
            <div id="executiveLine" class="hint">LINE: -</div>
            <button
  type="button"
  class="btn-line-link"
  onclick="createLineLinkCode(document.getElementById('executiveSelect').value)"
>
  <span class="material-symbols-outlined" style="font-size:18px;">link</span>
  สร้างรหัสเชื่อม LINE
</button>
          </div>
        </div>
        <div class="actions">
          <button id="saveExecutiveBtn" class="save">บันทึกผู้บริหาร L3</button>
        </div>
      </section>

      <section class="card">
        <div class="form-grid">
          <div class="field full">
            <label for="departmentSelect">แผนก</label>
            <select id="departmentSelect">
              <option value="">กำลังโหลดแผนก...</option>
            </select>
          </div>
          <div class="field">
            <label for="supervisorSelect">หัวหน้า L1</label>
            <select id="supervisorSelect" disabled>
              <option value="">-- เลือกหัวหน้า --</option>
            </select>
            <div id="supervisorLine" class="hint">LINE: -</div>
            <button
  type="button"
  class="btn-line-link"
  onclick="createLineLinkCode(document.getElementById('supervisorSelect').value)"
>
  <span class="material-symbols-outlined" style="font-size:18px;">link</span>
  สร้างรหัสเชื่อม LINE
</button>
          </div>
          <div class="field">
            <label for="managerSelect"
              >ผู้จัดการ L2
              <span style="color: #64748b; font-weight: 500"
                >(ถ้ามี)</span
              ></label
            >
            <select id="managerSelect" disabled>
              <option value="">-- ไม่มี / ข้าม L2 --</option>
            </select>
            <div id="managerLine" class="hint">LINE: -</div>
            <button
  type="button"
  class="btn-line-link"
  onclick="createLineLinkCode(document.getElementById('managerSelect').value)"
>
  <span class="material-symbols-outlined" style="font-size:18px;">link</span>
  สร้างรหัสเชื่อม LINE
</button>
          </div>
        </div>
        <div class="actions">
          <button id="saveApproverBtn" class="save" disabled>
            บันทึกสายอนุมัติ
          </button>
        </div>
      </section>

      <h2 class="section-title">สายอนุมัติที่ตั้งค่าแล้ว</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>แผนก</th>
              <th>หัวหน้า L1</th>
              <th>LINE</th>
              <th>ผู้จัดการ L2 (ถ้ามี)</th>
              <th>LINE</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <tbody id="approverTableBody">
            <tr>
              <td colspan="6" class="empty">กำลังโหลดข้อมูล...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/approval-settings.js"></script>
  </body>
</html>
