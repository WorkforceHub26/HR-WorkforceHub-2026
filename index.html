<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PVT HR Leave - เข้าสู่ระบบ</title>
    
    <meta name="theme-color" content="#0d9488"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="PVT Leave"/>
    <link rel="manifest" href="/manifest.json"/>
    <link rel="apple-touch-icon" href="/assets/icons/logo-pvt.png"/>
    <link rel="icon" type="image/png" href="/assets/icons/logo-pvt.png"/>
    
    <!-- Modern Thai & International Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <link rel="stylesheet" href="/css/index.css"/>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="login-container">
      <main class="login-card">
        
        <section class="brand-area">
          <div class="logo-wrapper">
            <img src="/assets/icons/logo-pvt.png" alt="PVT Logo" class="brand-logo"/>
          </div>
          <h1>PVT HR Leave</h1>
          <div class="brand-badge">
            <span class="pulse-dot"></span>
            <span>ระบบขออนุญาตลาออนไลน์</span>
          </div>
        </section>
        
        <form id="loginForm">
          <div class="form-group">
            <label for="username">รหัสพนักงาน หรือ ชื่อ-นามสกุล</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">badge</span>
              <input type="text" id="username" class="input-field" placeholder="กรอกรหัสพนักงาน หรือ ชื่อพนักงาน" autocomplete="username" required/>
            </div>
          </div>
          
          <div class="form-group">
            <label for="password">รหัสผ่าน (Password)</label>
            <div class="input-wrapper password-wrapper">
              <span class="material-symbols-outlined input-icon">lock</span>
              <input type="password" id="password" class="input-field" placeholder="กรอกรหัสผ่านเข้าสู่ระบบ" autocomplete="current-password" required>
              <!-- เรียกใช้ฟังก์ชัน togglePassword เมื่อคลิก -->
              <span class="toggle-password material-symbols-outlined" onclick="togglePassword()" title="แสดง/ซ่อนรหัสผ่าน">visibility_off</span>
            </div>
          </div>

          <button type="submit" class="login-btn">
            <span class="material-symbols-outlined">login</span>
            <span>เข้าสู่ระบบ</span>
          </button>
          
          <button type="button" class="qr-btn" onclick="loginByQr()">
            <span class="material-symbols-outlined">qr_code_scanner</span>
            <span>สแกนคิวอาร์โค้ดบัตรพนักงาน</span>
          </button>
        </form>
      </main>

      <div class="login-footer-info">
        <span>© 2026 PVT Workforce Management System · Ver 2.5</span>
      </div>
    </div>

    <!-- ส่วนโหลดสคริปต์ต่างๆ -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/system-diagnostics.js"></script>
    <script src="/auth/index.js"></script>
  </body>
</html>
