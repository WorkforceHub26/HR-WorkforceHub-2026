<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PVT HR Leave - เข้าสู่ระบบ</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <link rel="stylesheet" href="./css/global.css"/>
    <link rel="stylesheet" href="./css/theme.css"/>
    <link rel="stylesheet" href="./css/components.css"/>
    <link rel="stylesheet" href="./css/login.css"/>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <div class="login-container">
      <main class="login-card">
        
        <section class="brand-area">
          <img src="/assets/icons/logo-pvt.png" alt="PVT Logo"/>
          <h1>PVT HR Leave</h1>
          <p>ระบบขออนุญาตลาออนไลน์</p>
        </section>
        
        <form id="loginForm">
          <div class="form-group">
            <label for="username">รหัสพนักงาน</label>
            <input type="text" id="username" class="input-field" placeholder="รหัสพนักงาน หรือ ชื่อ-นามสกุล" autocomplete="username" required/>
          </div>
          
          <div class="form-group">
            <label for="password">รหัสผ่าน</label>
            <div class="password-wrapper">
              <input type="password" id="password" class="input-field" placeholder="••••••••" autocomplete="current-password" required/>
              <span class="material-symbols-outlined toggle-password" onclick="togglePassword()">visibility_off</span>
            </div>
          </div>

          <button type="submit" class="login-btn btn-primary">เข้าสู่ระบบ</button>
          
          <button type="button" class="qr-btn" onclick="loginByQr()">
            <span class="material-symbols-outlined" style="font-size: 20px;">qr_code_scanner</span>
            สแกน QR Code เพื่อล็อกอิน
          </button>
        </form>
        
        <p class="footer-text">Version 1.1.0</p>
      </main>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <script src="/js/supabase-config.js"></script>
    <script src="/js/pvt-logger.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/auth/login.js?v=999"></script>
  </body>
</html>
